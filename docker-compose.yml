services:
  # ==========================================
  # Servicio de Base de Datos (MySQL 8.4)
  # ==========================================
  db:
    image: mysql:8.4
    container_name: mining_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-equipos_mineros}
      MYSQL_USER: ${DB_USER:-mining_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mining_pass_2026}
    ports:
      - "${HOST_DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - mining_network

  # ==========================================
  # Servicio de Backend (API Express + Prisma)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mining_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: mysql://${DB_USER:-mining_user}:${DB_PASSWORD:-mining_pass_2026}@db:3306/${DB_NAME:-equipos_mineros}
      API_KEY: ${API_KEY:-mining_secret_key_2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173}
      RUN_SEED: ${RUN_SEED:-false}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - mining_network

  # ==========================================
  # Servicio de Frontend (SPA React + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_API_KEY: ${VITE_API_KEY:-mining_secret_key_2026}
    container_name: mining_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - mining_network

# ==========================================
# Volúmenes y Redes
# ==========================================
volumes:
  mysql_data:
    name: mining_mysql_data

networks:
  mining_network:
    name: mining_network
    driver: bridge

